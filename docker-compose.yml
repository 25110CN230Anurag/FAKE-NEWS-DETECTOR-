version: '3.8'

services:
  truthlens-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truthlens-ai
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_FACTCHECK_API_KEY=${GOOGLE_FACTCHECK_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    restart: unless-stopped
